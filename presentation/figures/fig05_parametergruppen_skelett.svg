<text x="930.7" y="543.9" font-size="21" font-weight="700" fill="#0d192f" text-anchor="start" font-family="Consolas, monospace">body_fins.chord = 40</text>
<text x="930.7" y="569.9" font-size="18" font-weight="400" fill="#565e6d" text-anchor="start" >einziger geänderter Parameter</text>
