<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d" font-family="'Outfit', 'Segoe UI', Arial, sans-serif">
<title id="t">Parametergruppen und Skelett-Methode</title>
<desc id="d">Das Skelett in der Mitte enthält die gemeinsamen Schnittstellenmasse. Neun Gruppen lesen nur ihre eigenen Parameter und das Skelett. Beispiel: nur body_fins.chord wird geändert.</desc>
